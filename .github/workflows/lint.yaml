name: lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ty:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          activate-environment: "true"

      - run: uv sync

      - run: ty check . --output-format=github

  pytest:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          activate-environment: "true"

      - run: uv sync

      - name: pytest
        run: pytest tests/ -v

  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - uses: trim21/actions/prek@master

  pyright:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.3

      - run: uv sync

      - uses: jakebailey/pyright-action@v3.0.2
        with:
          version: "1.1.414"
